# Mantém o projeto Supabase do Prognos (plano free) ativo, evitando a pausa por inatividade.
# Roda todo dia e também pode ser disparado manualmente (aba Actions > Run workflow).
# A chave usada é a publicável (pública por natureza, a mesma do app.js); ela só consegue
# escrever na tabela keep_alive. Para trocar, crie o secret SUPABASE_ANON_KEY no repositório.

name: Supabase Keep-Alive

on:
  schedule:
    - cron: "17 12 * * *"   # todo dia 12:17 UTC (09:17 Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://hxzgorearzxtvippjhjg.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_eIfvP_NdNxo8nXYxookWiw_MTmQkCxY' }}
    steps:
      - name: Registrar ping no banco (escrita real)
        run: |
          STATUS=$(curl -s -o resp.txt -w "%{http_code}" \
            -X POST "$SUPABASE_URL/rest/v1/keep_alive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"origem":"github-actions"}')
          echo "HTTP $STATUS"
          cat resp.txt || true
          if [ "$STATUS" -ge 300 ]; then
            echo "Falha no ping ao Supabase"; exit 1
          fi

      - name: Atividade extra (auth e função de borda)
        run: |
          curl -s -m 30 "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_KEY" | head -c 200; echo
          curl -s -m 30 -o /dev/null -w "ia HTTP %{http_code}\n" -X OPTIONS "$SUPABASE_URL/functions/v1/ia"

      - name: Leitura de confirmação
        run: |
          curl -s -f "$SUPABASE_URL/rest/v1/keep_alive?select=id,criado_em&order=id.desc&limit=1" \
            -H "apikey: $SUPABASE_KEY"
